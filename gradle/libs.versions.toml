# Catalogue de versions unique : aucune version en dur dans un module.

[versions]
agp = "8.7.3"
archunit = "1.3.0"
# La bibliothèque Material : les vrais conteneurs de l'écran du sample
# (TabLayout, DrawerLayout, CoordinatorLayout, BottomSheetBehavior) y
# vivent — la mesure et la disposition deviennent celles du cadre.
material = "1.12.0"
checkstyle = "10.18.2"
java = "17"
junit = "4.13.2"
lsp4j = "1.0.0"
# Gson figé : lsp4j le déclare en intervalle ([2.9.1,3)) — Gradle y
# résout seul (2.15.0 aujourd'hui). La fourchette laisse la version
# bouger entre deux builds : le chiffre ci-dessous l'épingle, la
# reprise d'un build ancien reprend SA Gson.
gson = "2.15.0"
compileSdk = "35"
minSdk = "26"
targetSdk = "35"
# Le harnais d'intégration : Robolectric porte les VRAIES classes du
# cadre (View, Canvas, MotionEvent, Toast, l'app-bar Material) sur
# machine virtuelle — les stubs du vieux harnais ne tenaient pas la
# parité de l'API (le rapport d'analyse l'a dit : la sauvegarde
# d'état du cadre y était invisible).
robolectric = "4.14.1"

[libraries]
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
material = { module = "com.google.android.material:material", version.ref = "material" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
# Le client de serveur de langage : lsp4j porte le protocole et le
# JSON-RPC, gson en dépend (transitif, la version y est un intervalle
# que Gradle résout) — la seule dépendance extérieure du dépôt,
# décision du propriétaire au chantier 26.
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
lsp4j = { module = "org.eclipse.lsp4j:org.eclipse.lsp4j", version.ref = "lsp4j" }
lsp4j-jsonrpc = { module = "org.eclipse.lsp4j:org.eclipse.lsp4j.jsonrpc", version.ref = "lsp4j" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
